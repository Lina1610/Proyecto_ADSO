<script src="{{ url_for('static', filename='assets/js/menu_responsive.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/accesibilidad.js') }}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
<script src="{{ url_for('static', filename='assets/js/carrito.js') }}"></script>

<script>
    window.addEventListener('scroll', function() {
        const menu = document.querySelector('.menu');
        let scrollPosition = window.scrollY;
        if (scrollPosition > 50) {
            menu.classList.add('scrolled');
        } else {
            menu.classList.remove('scrolled');
        }
    });
</script>
<script>
    AOS.init({
        duration: 1000,
        once: false,
        easing: 'ease-in-out',
        mirror: true
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        gsap.registerPlugin(TextPlugin);
        gsap.set("#animated-text", { text: "", opacity: 0 });
        gsap.to("#animated-text", {
            duration: 2,
            opacity: 1,
            text: "TAMALES EL BUEN SAZÓN",
            ease: "power2.out",
            delay: 0.5
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const whatsappBtn = document.querySelector('.whatsapp-btn');
        window.addEventListener('scroll', function() {
            const scrollPosition = window.scrollY;
            const viewportHeight = window.innerHeight;
            if (scrollPosition + viewportHeight > document.body.offsetHeight - 200) {
                whatsappBtn.style.bottom = '100px';
            } else {
                whatsappBtn.style.bottom = '40px';
            }
        });
    });
    window.addEventListener('load', function() { new Accessibility(); }, false);
</script>
<script src="{{ url_for('static', filename='assets/js/sienna.js') }}"></script>
