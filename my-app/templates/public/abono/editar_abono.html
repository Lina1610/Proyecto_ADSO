{% extends 'public/base_cpanel.html' %}

<!-- Cambiando el title -->
{% block title %}Crud con Python 🐍 | Editar Abono{% endblock %}

<!-- Inicio del block -->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">
        <a href="/lista-de-abonos">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
        EDITAR ABONO
      </h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
        <form
        class="form-horizontal mx-auto"
        method="POST"
        action="{{ url_for('viewEditarAbono', id=abono.id) }}"
        autocomplete="off">
        <input type="hidden" name="id" value="{{ abono.id }}">

        <div class="row">
          <div class="col-md-6">
            <label for="numero_abonos" class="form-label">Número de Abono</label>
            <select class="form-select" name="numero_abonos" required>
              <option value="Pago inicial" {% if abono.numero_abonos == 'Pago inicial' %}selected{% endif %}>Pago Inicial</option>
              <option value="Pago final" {% if abono.numero_abonos == 'Pago final' %}selected{% endif %}>Pago Final</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="estado" class="form-label">Estado</label>
            <select class="form-select" name="estado" required>
              <option value="Abono Pendiente" {% if abono.estado == 'Abono Pendiente' %}selected{% endif %}>Abono Pendiente</option>
              <option value="Abono confirmado" {% if abono.estado == 'Abono confirmado' %}selected{% endif %}>Abono Confirmado</option>
            </select>
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <label for="monto" class="form-label">Monto</label>
            <input
              type="number"
              name="monto"
              class="form-control"
              value="{{ abono.monto }}"
              required />
          </div>
          <div class="col-md-6">
            <label for="pedido_id" class="form-label">Pedido ID</label>
            <input
              type="text"
              name="pedido_id"
              class="form-control"
              value="{{ abono.pedido_id }}"
              required />
          </div>
        </div>

        <div class="mb-3 mt-4 text-center">
          <button type="submit" class="btn rounded-pill btn-primary">
            Guardar cambios
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
