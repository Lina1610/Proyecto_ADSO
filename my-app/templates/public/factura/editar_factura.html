{% extends 'public/base_cpanel.html' %}

<!-- Cambiando el title -->
{% block title %}Crud con Python 🐍 | Editar Factura{% endblock %}

<!-- Inicio del block -->
{% block body %}

<link rel="stylesheet" href="{{ url_for('static', filename ='assets/css/editar.css') }}" />


<div class="card" >
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-4" >
        <a href="/lista-de-facturas">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
        EDITAR FACTURA
      </h3>
      <hr/>
    </div>
  </div>

  <div class="row justify-content-center mb-4">
    <div class="col-md-10">
      <div class="card-body">
        <form action="{{ url_for('viewEditarFactura', id=factura.id) }}" method="POST">
          <div class="row">
            <!-- Estado de la Factura -->
            <div class="col-md-6 mb-3">
              <label for="estado" class="form-label" style="font-weight: bold;">
                Estado de la Factura
              </label>
              <select class="form-select" id="estado" name="estado" required>
                <option value="Pendiente" {% if factura.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                <option value="Facturado" {% if factura.estado == 'Facturado' %}selected{% endif %}>Facturado</option>
              </select>
            </div>

            <!-- Fecha de la Factura (editable) -->
            <div class="col-md-6 mb-3">
              <label for="fecha" class="form-label" style="font-weight: bold;">
                Fecha de la Factura
              </label>
              <input
                type="datetime-local"
                class="form-control"
                id="fecha"
                name="fecha"
                value="{{ factura.fecha.strftime('%Y-%m-%dT%H:%M') if factura.fecha else '' }}"
                required
              >
            </div>
          </div>

          <div class="row">
            <!-- ID del Pedido -->
            <div class="col-md-6 mb-3">
              <label for="pedido_id" class="form-label" style="font-weight: bold;">
                ID del Pedido
              </label>
              <input
                type="number"
                class="form-control"
                id="pedido_id"
                name="pedido_id"
                value="{{ factura.pedido_id }}"
                required
              >
            </div>
          </div>
       

          <!-- Botones de Guardar y Cancelar -->
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save"></i> Guardar Cambios
            </button>
            <br>
            <br>
           
            <a href="/lista-de-facturas" class="btn btn-secondary">
              <i class="bi bi-x-circle"></i> Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
