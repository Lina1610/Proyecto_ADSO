{% extends 'public/login/base_login.html' %}

{% block title %}Crud con Python 🐍 | Crear cuenta{% endblock %}

{% block body %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card custom-card">
        <div class="card-body">
          <div class="app-brand justify-content-center">
            <span class="app-brand-logo">
              <img
                class="logo"
                src="{{ url_for('static', filename ='assets/img/logose.png') }}"
                alt="Logo" />
            </span>
          </div>
          <form
            class="mb-3"
            action="{{ url_for('cpanelResgisterUserBD') }}"
            method="POST">
            <!-- Fila para organizar los campos en dos columnas -->
            <div class="row">
              <!-- Columna izquierda -->
              <div class="col-md-6">
                <div class="mb-4">
                  <label for="name_surname" class="form-label">
                    Nombre y apellido
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    name="name_surname"
                    required
                    autofocus />
                </div>
                <div class="mb-4">
                  <label for="email_user" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    name="email_user"
                    required />
                </div>
                <div class="mb-4 form-password-toggle">
                  <label class="form-label" for="pass_user">Clave</label>
                  <div class="input-group input-group-merge">
                    <input
                      type="password"
                      class="form-control"
                      name="pass_user"
                      id="pass_user"
                      placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                      aria-describedby="password"
                      required />                                       
                  </div>
                </div>
              </div>

              <!-- Columna derecha -->
              <div class="col-md-6">
                <div class="mb-4">
                  <label for="cc" class="form-label">DOCUMENTO IDENTIDAD</label>
                  <input
                    type="text"
                    class="form-control"
                    name="cc"
                    required />
                </div>
                <div class="mb-4">
                  <label for="direccion" class="form-label">Dirección</label>
                  <input
                    type="text"
                    class="form-control"
                    name="direccion"
                    required />
                </div>
                <div class="mb-4">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input
                    type="tel"
                    class="form-control"
                    name="telefono"
                    required />
                </div>
              </div>
            </div>

            <!-- Botón de enviar -->
            <button class="btn btn-primary w-100">
              Crear cuenta
              <i class="bi bi-arrow-right-circle"></i>
            </button>
          </form>

          <!-- Enlace para volver -->
          <div class="text-center">
            <a
              href="{{ url_for('inicio') }}"
              class="d-flex align-items-center justify-content-center">
              <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
              volver
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
