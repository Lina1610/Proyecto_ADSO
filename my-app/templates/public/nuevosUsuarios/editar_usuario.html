{% extends 'public/base_cpanel.html' %}

<!-- Cambiando el title -->
{% block title %}Crud con Python 🐍 | Editar Usuario{% endblock %}

<!-- Inicio del block -->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">
        <a href="/lista-de-usuarios">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
        EDITAR USUARIO
      </h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="{{ url_for('actualizarUsuario') }}"
        autocomplete="off">
        <input type="hidden" name="id" value="{{ usuario.id }}">

        <div class="row">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input
              type="text"
              name="nombre"
              class="form-control"
              value="{{ usuario.nombre }}"
              required />
          </div>
          <div class="col-md-6">
            <label for="apellido" class="form-label">Apellido</label>
            <input
              type="text"
              name="apellido"
              class="form-control"
              value="{{ usuario.apellido }}"
              required />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <label for="tipo_documento" class="form-label">Tipo de documento</label>
            <select class="form-select" name="tipo_documento" required>
              <option value="Cedula ciudadania" {% if usuario.tipo_documento == 'Cedula ciudadania' %}selected{% endif %}>Cédula de Ciudadanía</option>
              <option value="Tarjeta identidad" {% if usuario.tipo_documento == 'Tarjeta identidad' %}selected{% endif %}>Tarjeta de Identidad</option>
              <option value="Cedula extranjeria" {% if usuario.tipo_documento == 'Cedula extranjeria' %}selected{% endif %}>Cédula de Extranjería</option>
              <option value="NIT" {% if usuario.tipo_documento == 'NIT' %}selected{% endif %}>NIT</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="documento" class="form-label">Documento</label>
            <input
              type="text"
              name="documento"
              class="form-control"
              value="{{ usuario.documento }}"
              required />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <label for="correo" class="form-label">Correo</label>
            <input
              type="email"
              name="correo"
              class="form-control"
              value="{{ usuario.correo }}"
              required />
          </div>
          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input
              type="text"
              name="telefono"
              class="form-control"
              value="{{ usuario.telefono }}"
              required />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <label for="rol" class="form-label">Rol</label>
            <select class="form-select" name="rol" required>
              <option value="administrador" {% if usuario.rol == 'administrador' %}selected{% endif %}>Administrador</option>
              <option value="cliente" {% if usuario.rol == 'cliente' %}selected{% endif %}>Cliente</option>
              <option value="proveedor" {% if usuario.rol == 'proveedor' %}selected{% endif %}>Proveedor</option>
              <option value="empleado" {% if usuario.rol == 'empleado' %}selected{% endif %}>Empleado</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="estado" class="form-label">Estado</label>
            <select class="form-select" name="estado" required>
              <option value="activo" {% if usuario.estado == 'activo' %}selected{% endif %}>Activo</option>
              <option value="inactivo" {% if usuario.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
            </select>
          </div>
        </div>

        <div class="mb-3 mt-4 text-center">
          <button type="submit" class="btn rounded-pill btn-primary">
            Guardar cambios
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </form>

      <!-- Formulario para cambiar la contraseña -->
      <hr>
      <h4 class="text-center mt-4 mb-3">Cambiar Contraseña</h4>
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="{{ url_for('cambiar_contrasena') }}"
        autocomplete="off">
        <input type="hidden" name="user_id" value="{{ usuario.id }}">

        <div class="row">
          <div class="col-md-12">
            <label for="nueva_password" class="form-label">Nueva Contraseña</label>
            <input
              type="password"
              name="nueva_password"
              class="form-control"
              placeholder="Ingrese la nueva contraseña"
              required />
          </div>
        </div>

        <div class="mb-3 mt-4 text-center">
          <button type="submit" class="btn rounded-pill btn-warning">
            Cambiar Contraseña
            <i class="bi bi-key"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
