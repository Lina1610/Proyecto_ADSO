{% extends 'public/base_cpanel.html' %}

{% block title %}Editar Pedido{% endblock %}

{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">EDITAR PEDIDO</h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form class="form-horizontal mx-auto" method="POST" action="{{ url_for('viewEditarPedido', id=pedido.id) }}">
        <div class="card-body">
          <div class="row">
            <!-- Columna izquierda -->
            <div class="col-md-6">
              <!-- Fecha -->
              <div class="mb-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" class="form-control" name="fecha" value="{{ pedido.fecha }}" required>
              </div>

              <!-- Fecha Entrega -->
              <div class="mb-3">
                <label for="fechaEntrega" class="form-label">Fecha Entrega</label>
                <input type="date" class="form-control" name="fechaEntrega" value="{{ pedido.fechaEntrega }}" required>
              </div>

              <!-- Hora Entrega -->
              <div class="mb-3">
                <label for="horaEntrega" class="form-label">Hora Entrega</label>
                <input type="time" class="form-control" name="horaEntrega" value="{{ pedido.horaEntrega }}" required>
              </div>

              <!-- Estado -->
              <div class="mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" name="estado" required>
                  <option value="Pendiente" {% if pedido.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                  <option value="En Proceso" {% if pedido.estado == 'En Proceso' %}selected{% endif %}>En Proceso</option>
                  <option value="En camino" {% if pedido.estado == 'En camino' %}selected{% endif %}>En camino</option>
                  <option value="Entregado" {% if pedido.estado == 'Entregado' %}selected{% endif %}>Entregado</option>
                </select>
              </div>
            </div>

            <!-- Columna derecha -->
            <div class="col-md-6">
              <!-- Usuario -->
              <div class="mb-3">
                <label for="users_id" class="form-label">Usuario</label>
                <select class="form-select" name="users_id" required>
                  {% for usuario in usuarios %}
                    <option value="{{ usuario.id }}" {% if usuario.id == pedido.users_id %}selected{% endif %}>{{ usuario.nombre }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Producto -->
              <div class="mb-3">
                <label for="producto_id" class="form-label">Producto</label>
                <select class="form-select" name="producto_id" required>
                  {% for producto in productos %}
                    <option value="{{ producto.id }}" {% if producto.id == pedido.producto_id %}selected{% endif %}>{{ producto.nombre }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Método de Pago -->
              <div class="mb-3">
                <label for="metodo_pago" class="form-label">Método de Pago</label>
                <select class="form-select" name="metodo_pago" required>
                  {% for metodo in metodos_pago %}
                    <option value="{{ metodo.id }}" {% if metodo.id == pedido.metodo_pago_id %}selected{% endif %}>{{ metodo.metodo }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Tipo de Entrega -->
              <div class="mb-3">
                <label for="tipo_entrega" class="form-label">Tipo de Entrega</label>
                <select class="form-select" name="tipo_entrega" required>
                  {% for tipo in tipos_entrega %}
                    <option value="{{ tipo }}" {% if tipo == pedido.tipo_entrega %}selected{% endif %}>{{ tipo }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>

          <!-- Botón de guardar -->
          <div class="mb-3 mt-4 text-center">
            <button type="submit" class="btn rounded-pill btn-primary">
              Guardar cambios
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
