{% extends 'public/base_cpanel.html' %}
<!--Cambiando el title-->
{% block title %}Crud con Python 🐍 | Editar Producto{% endblock %}
<!---->
{% block customCSS %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename ='assets/css/editar.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/footer.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/menu.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/position_indicator.css') }}" />
<link
  rel="stylesheet"
  href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

<!--Inicio del block-->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">
        <a href="{{ url_for('lista_productos') }}">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
        EDITAR PRODUCTO
      </h3>
      <hr />
    </div>
  </div>
   <!-- Mensaje de contexto -->
   <div class="context-indicator d-flex align-items-center">
    <i class="bi bi-people-fill context-icon"></i>
    <div>
      <h6 class="mb-1">Vista de editar de productos</h6>
      
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <!-- Formulario de edición -->
<form class="form-horizontal mx-auto"
method="POST"
action="{{ url_for('viewEditarProducto', id=producto.id) }}"
autocomplete="off">
<div class="card-body">
  <div class="row">
      <!-- Columna 1 -->
      <div class="col-md-6">
          <!-- Código del producto (nuevo campo agregado al inicio) -->
          <label for="codigo" class="form-label">Código del producto</label>
          <input type="text" class="form-control" id="codigo" name="codigo" value="{{ producto.codigo }}" required />

          <label for="nombre" class="form-label">Nombre del producto</label>
          <input type="text" class="form-control" id="nombre" name="nombre" value="{{ producto.nombre }}" required />

          <label for="descripcion" class="form-label">Descripción del producto</label>
          <textarea class="form-control" id="descripcion" name="descripcion" required>{{ producto.descripcion }}</textarea>

          <label for="marca" class="form-label">Marca del producto</label>
          <input type="text" class="form-control" id="marca" name="marca" value="{{ producto.marca }}" required />

          <label for="estado" class="form-label">Estado del producto</label>
          <select class="form-select" id="estado" name="estado" required>
              <option value="Disponible" {% if producto.estado == "Disponible" %}selected{% endif %}>Disponible</option>
              <option value="No disponible" {% if producto.estado == "No disponible" %}selected{% endif %}>No disponible</option>
          </select>
      </div>

      <!-- Columna 2 -->
      <div class="col-md-6">
          <label for="precio" class="form-label">Precio del producto</label>
          <input type="text" class="form-control" id="precio" name="precio" value="{{ producto.precio }}" required />

          <label for="cantidad" class="form-label">Cantidad del producto</label>
          <input type="number" class="form-control" id="cantidad" name="cantidad" value="{{ producto.cantidad }}" required min="1" />

          <label for="unidad_medida" class="form-label">Unidad de medida</label>
          <input type="text" class="form-control" id="unidad_medida" name="unidad_medida" value="{{ producto.unidad_medida }}" required />

          <label for="total" class="form-label">Total del producto</label>
          <input type="text" class="form-control" id="total" name="total" value="{{ producto.total }}" readonly required />
      </div>
  </div>

  <!-- Botón de guardar cambios -->
  <div class="mb-3 mt-4 text-center">
      <button type="submit" class="btn rounded-pill btn-primary">
          Guardar cambios
          <i class="bi bi-arrow-clockwise"></i>
      </button>
  </div>
</div>
</form>

    </div>
  </div>
</div>
{% endblock %}
