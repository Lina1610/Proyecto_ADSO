{% extends 'public/base_cpanel.html' %}
{% block title %}Crud con Python 🐍 | Editar Producto{% endblock %}

{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">
        <a href="{{ url_for('lista_productos') }}">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
        EDITAR PRODUCTO
      </h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="{{ url_for('viewEditarProducto', id=producto.id) }}"
        autocomplete="off">
        <div class="card-body">
          <div class="row">
            <!-- Columna 1 -->
            <div class="col-md-6">
              <label for="codigo" class="form-label">Código del producto</label>
              <input type="text" class="form-control" id="codigo" name="codigo" value="{{ data_form.get('codigo', producto.codigo) }}" pattern="[0-9]+" maxlength="10" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57))" required>

              <label for="nombre" class="form-label">Nombre del producto</label>
              <input type="text" class="form-control" id="nombre" name="nombre" value="{{ data_form.get('nombre', producto.nombre) }}" maxlength="100" required>

              <label for="descripcion" class="form-label">Descripción del producto</label>
              <textarea class="form-control" id="descripcion" name="descripcion" maxlength="100" required>{{ data_form.get('descripcion', producto.descripcion) }}</textarea>

              <label for="estado" class="form-label">Estado del producto</label>
              <select class="form-select" id="estado" name="estado" required>
                <option value="Disponible" {% if data_form.get('estado', producto.estado) == 'Disponible' %}selected{% endif %}>Disponible</option>
                <option value="No disponible" {% if data_form.get('estado', producto.estado) == 'No disponible' %}selected{% endif %}>No disponible</option>
              </select>
            </div>

            <!-- Columna 2 -->
            <div class="col-md-6">
              <label for="precio" class="form-label">Precio del producto</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="precio" name="precio" value="{{ data_form.get('precio', producto.precio) }}" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57) || event.charCode == 46)" required>

              <label for="cantidad" class="form-label">Cantidad del producto</label>
              <input type="number" min="1" class="form-control" id="cantidad" name="cantidad" value="{{ data_form.get('cantidad', producto.cantidad) }}" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57))" required>

              <label for="total" class="form-label">Total del producto</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="total" name="total" value="{{ data_form.get('total', producto.total) }}" onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57) || event.charCode == 46)" readonly required>
            </div>
          </div>

          <!-- Botón de guardar cambios -->
          <div class="mb-3 mt-4 text-center">
            <button type="submit" class="btn rounded-pill btn-primary">
              Guardar cambios
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block customJS %}
<script>
  // Función para calcular el total automáticamente
  function calcularTotal() {
    const cantidad = parseFloat(document.getElementById('cantidad').value);
    const precio = parseFloat(document.getElementById('precio').value);

    if (!isNaN(cantidad) && !isNaN(precio)) {
      const total = cantidad * precio;
      document.getElementById('total').value = total.toFixed(2);
    } else {
      document.getElementById('total').value = '';
    }
  }

  // Escuchamos cambios en los campos cantidad y precio para recalcular el total
  document.getElementById('cantidad').addEventListener('input', calcularTotal);
  document.getElementById('precio').addEventListener('input', calcularTotal);

  // Personalizar mensajes de validación en español
  document.getElementById('codigo').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('El código es obligatorio.');
    } else if (event.target.validity.patternMismatch) {
      event.target.setCustomValidity('El código solo debe contener números.');
    }
  });

  document.getElementById('codigo').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });

  document.getElementById('nombre').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('El nombre es obligatorio.');
    }
  });

  document.getElementById('nombre').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });

  document.getElementById('descripcion').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('La descripción es obligatoria.');
    }
  });

  document.getElementById('descripcion').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });

  document.getElementById('estado').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('El estado es obligatorio.');
    }
  });

  document.getElementById('estado').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });

  document.getElementById('precio').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('El precio es obligatorio.');
    } else if (event.target.validity.rangeUnderflow) {
      event.target.setCustomValidity('El precio debe ser mayor a 0.');
    }
  });

  document.getElementById('precio').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });

  document.getElementById('cantidad').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('La cantidad es obligatoria.');
    } else if (event.target.validity.rangeUnderflow) {
      event.target.setCustomValidity('La cantidad debe ser mayor a 0.');
    }
  });

  document.getElementById('cantidad').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });

  document.getElementById('total').addEventListener('invalid', function (event) {
    if (event.target.validity.valueMissing) {
      event.target.setCustomValidity('El total es obligatorio.');
    } else if (event.target.validity.rangeUnderflow) {
      event.target.setCustomValidity('El total debe ser mayor a 0.');
    }
  });

  document.getElementById('total').addEventListener('input', function (event) {
    event.target.setCustomValidity('');
  });
</script>
{% endblock %}
