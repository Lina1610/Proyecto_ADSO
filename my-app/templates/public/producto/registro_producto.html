{% extends 'public/base_cpanel.html' %}
<!--Cambiando el title-->
{% block title %}Crud con Python 🐍 | Registrar Producto{% endblock %}
<!---->
{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

<!--Inicio del block-->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">REGISTRAR PRODUCTO NUEVO</h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="/registrar-producto"
        autocomplete="off"
        enctype="multipart/form-data">
        <div class="card-body">
          <div class="row">
            <!-- Columna 1 -->
            <div class="col-md-6">
              <label for="codigo" class="form-label">Codigo</label>
              <input type="text" name="codigo" class="form-control" required />


              <label for="nombre_producto" class="form-label">Nombre del producto</label>
              <input type="text" name="nombre" class="form-control" required />
          
              <label for="descripcion_producto" class="form-label">Descripción del producto</label>
              <input class="form-control" type="text" name="descripcion" required />

              <label for="marca_producto" class="form-label">Marca del producto</label>
              <input class="form-control" type="text" name="marca" required />
          
              <label for="estado_producto" class="form-label">Estado del producto</label>
              <select class="form-select" name="estado" aria-label="Default select example">
                <option selected>Seleccione</option>
                <option value="Disponible">Disponible</option>
                <option value="No disponible">No disponible</option>
              </select>
                        
            </div>
          
            <!-- Columna 2 -->
            <div class="col-md-6">
              <label for="precio_producto" class="form-label">Precio del producto</label>
              <input class="form-control" type="text" name="precio" id="precio" required />

              <label for="cantidad_producto" class="form-label">Cantidad del producto</label>
              <input class="form-control" type="number" name="cantidad" id="cantidad" required min="1" />
              
          
              <label for="unidad_medida_producto" class="form-label">Unidad de medida</label>
              <input class="form-control" type="text" name="unidad_medida" required />
          
              <label for="total_producto" class="form-label">Total del producto</label>
              <input class="form-control" type="text" name="total" id="total" readonly required />

              <label for="imagen_producto" class="form-label">Imagen del producto</label>
              <input class="form-control" type="file" name="imagen" accept="image/*" required />
                 
              
            </div>
          </div>

          <!-- Botón de guardar registro -->
          <div class="mb-3 mt-4 text-center">
            <button type="submit" class="btn rounded-pill btn-primary">
              Guardar registro ahora
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block customJS %}
<script>
  // Función para calcular el total
  function calcularTotal() {
    const cantidad = parseFloat(document.getElementById('cantidad').value);
    const precio = parseFloat(document.getElementById('precio').value);

    if (!isNaN(cantidad) && !isNaN(precio)) {
      const total = cantidad * precio;
      document.getElementById('total').value = total.toFixed(2);
    } else {
      document.getElementById('total').value = '';
    }
  }

  // Escuchar cambios en los campos de cantidad y precio
  document.getElementById('cantidad').addEventListener('input', calcularTotal);
  document.getElementById('precio').addEventListener('input', calcularTotal);
</script>
{% endblock %}
